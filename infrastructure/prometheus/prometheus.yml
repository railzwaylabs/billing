global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: billing
    static_configs:
      - targets: [admin-api:9090]
        labels:
          billing_service: admin-api
      - targets: [api:9090]
        labels:
          billing_service: public-api
      - targets: [rating:9090]
        labels:
          billing_service: rating
